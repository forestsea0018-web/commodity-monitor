name: Commodity News Monitor

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: commodity-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install feedparser requests
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: seen_articles.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - name: Run
        timeout-minutes: 2
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MAX_AGE_HOURS: '24'
          MAX_PUSH_PER_RUN: '30'
          DIGEST_MODE: '1'
        run: python cloud_monitor.py
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_articles.json
          key: seen-${{ github.run_id }}
