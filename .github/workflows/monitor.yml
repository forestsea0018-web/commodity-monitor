name: Commodity News Monitor
"on":
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install feedparser requests
      - name: Restore seen cache
        uses: actions/cache/restore@v4
        with:
          path: seen_articles.json
          key: seen-articles-${{ github.run_id }}
          restore-keys: |
            seen-articles-
      - name: Run monitor
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MAX_AGE_HOURS: "24"
          MAX_PUSH_PER_RUN: "30"
          DIGEST_MODE: "1"
        run: python cloud_monitor.py
      - name: Save seen cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_articles.json
          key: seen-articles-${{ github.run_id }}
